global:
  # server provides the structure for configuring the MSAKI server
  server:
    # listen defines what address/port the MSAKI server binds to
    listen:
      address: 0.0.0.0
      port: 8080
    # portMapping defines how executed services should have a port mapped dynamically to it
    # If a ${PORT} string is found in a model's startScript then MSAKI will dynamically provide a port number for use to avoid conflicts
    portMapping:
      # containerLabelOverrides allows for a container to use a msaki.proxyPort label to specify what port to use instead of having MSAKI dynamically provide one
      containerLabelOverrides: true
      # hostPortStart is the range where MSAKI managed ports will start from
      hostPortStart: 12000
    # authentication provides a way to allow users to log in
    # Currently supports HTPasswd file authentication, to be expanded to OIDC/OAuth2 in the future
    authentication:
      - name: admin_userpass
        provider: htpasswd
        path: /etc/msaki/htpasswd_admin
        role: administrator
      - name: chat_users_userpass
        provider: htpasswd
        path: /etc/msaki/htpasswd_users
        role: user

  # access provides configuration for access control to MSAKI
  access:
    # allowPublicAccess if true will allow full unauthenticated access to MSAKI
    allowPublicAccess: false
    # allowGuestAccess if true will allow unauthenticated access with a guest role that can only consume models
    allowGuestAccess: false
    # allowPublicModelList if true will allow unauthenticated users to see the list of available models
    allowPublicModelList: true

  observability:
    # Provides standard configuration for metrics endpoint
    metrics:
      enabled: true
      engine: prometheus
      prometheus:
        path: /metrics
    # accessLogs provide logging of proxy server requests
    accessLogs:
      enabled: true
      level: debug
      # sharedOutput if true will log to both file and stdout
      sharedOutput: true
      file: /var/log/msaki/access.log
      fileRotation: 10Mb
    # errorLogs provide logging of proxy server errors
    errorLogs:
      enabled: true
      level: debug
      # sharedOutput if true will log to both file and stdout
      sharedOutput: true
      file: /var/log/msaki/error.log
      fileRotation: 10Mb
    # chatLogs provide logging of chat messages
    chatLogs:
      enabled: false
      logDirectory: /var/log/msaki/chats/
      collections:
        - name: general
          models:
            - gpt-oss-120b
          requests: true
          responses: false
          filename: general-${MODEL}-${USERID}-${DATE-ymd}.log
        - name: exfil-detection
          models:
            - ext-openapi
            - ext-ollama
          requests: true
          responses: true
          filename: ext-${MODEL}-${USERID}-${DATE-ymd}.log

# models defines different endpoints that MSAKI proxies to
# Models listed here and detected by their APIs will be provided to consumers of MSAKI
models:
  - name: gpt-oss-120b
    description: GPT OSS 120b via vLLM
    # aliases provides alternative or simple names for models
    aliases:
      - gpt-oss
    # tags are simple metadata to filter/group models
    tags:
      - general
      - chat
      - gpt
      - 120b
      - vllm
    # startScript runs when the model is requested to be loaded
    # If ${PORT} is detected in the script then MSAKI will dynamically provide it a port to use
    startScript: /etc/msaki/model_scripts/gpt-oss-120b.sh ${PORT}
    # stopScript if provided will allow the model to be stopped and unloaded
    stopScript: docker stop vllm-gpt-oss-120b
    # backendOverride provides an alternative endpoint to proxy requests to
    # Useful for shell scripts or containers not exposing ports on an accessible network
    backendOverride: http://192.168.42.111:${PORT}
    # ttl if defined will auto stop and unload the model if there has not been activity sent to it
    ttl: 30m
    # healthCheck defines if MSAKI should detect availability of a model
    # This is useful for models that take a long time to load
    healthCheck:
      enabled: true
      endpoint: /ping
      startDelay: 360s
      interval: 10s
      # retries if a non-zero number will attempt the healthcheck N number of times
      # and finally stop the model if the healthcheck continues to fail
      # Set to 0 to disable stopping of the model
      retries: 12

  - name: ext-openapi
    description: External proxy to OpenAI
    # provider specifies what external model provider is being used
    provider: openai
    aliases:
      - openai
      - chatgpt
    tags:
      - general
      - chat
      - gpt
      - external
    # endpoint provides configuration for an external model provider such as OpenAI
    endpoint: https://api.openai.com/v1
    # api_key_env specifies what environmental variable provides the API key
    # Mutually exclusive with api_key_path
    api_key_env: OPENAI_API_KEY
    healthCheck:
      enabled: true
      endpoint: /health
      startDelay: 0s
      interval: 60s
      retries: 10

  - name: ext-ollama
    description: External Ollama server
    # provider specifies what external model provider is being used
    # Supported values: openai (default), ollama, anthropic
    # When set to "ollama", requests to /v1/chat/completions are automatically
    # translated to Ollama's /api/chat format
    provider: ollama
    # modelName specifies the actual model name to send to the backend
    # This allows you to expose a friendly name while using a different model internally
    modelName: llama3.2:latest
    aliases:
      - ollama
    tags:
      - external
      - ollama
      - chat
    endpoint: https://ollama.192.168.42.111.traefik.me
    # skip_tls_verify allows for not validating TLS chains
    skip_tls_verify: true
    healthCheck:
      enabled: true
      endpoint: /health
      startDelay: 0s
      interval: 60s
      retries: 10

  - name: ext-vllm-openai
    description: External vLLM server
    # provider specifies what external model provider is being used
    # Supported values: openai (default), ollama, anthropic
    # When set to "ollama", requests to /v1/chat/completions are automatically
    # translated to Ollama's /api/chat format
    provider: openai
    # modelName specifies the actual model name to send to the backend
    # This allows you to expose a friendly name while using a different model internally
    modelName: Qwen2.5-1.5B-Instruct-test
    aliases:
      - vllm
    tags:
      - external
      - openai
      - vllm
      - chat
    endpoint: https://vllm.192.168.42.111.traefik.me
    # skip_tls_verify allows for not validating TLS chains
    skip_tls_verify: false
    healthCheck:
      enabled: true
      endpoint: /health
      startDelay: 0s
      interval: 60s
      retries: 10

# tests defines test scenarios to run against models (deferred feature)
tests:
  - name: Basic Chat Test
    description: Just a simple poem
    prompt: Write me a sea shanty about gouda cheese
    endpoint: /v1/chat/completions
    method: POST
  - name: Basic Coder Test
    description: Just a simple script
    prompt: Write me a Python script that finds duplicate files between two paths and gives the option to delete extra copies from one of them.
    endpoint: /v1/chat/completions
    method: POST
